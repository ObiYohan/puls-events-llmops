# Hyperparamètres du RAG : seule source de vérité pour toutes les valeurs réglables.
# Suivi par DVC (section `params` des étapes) et loggé dans MLflow à chaque run.
# Les secrets n'ont rien à faire ici : ils passent par les variables d'environnement.

paths:                         # relatifs à la racine du projet
  raw_events: data/raw/events.json
  ingest_metrics: metrics/ingest.json
  chunks_dataset: data/processed/chunks.json
  chunk_metrics: metrics/chunk.json
  embeddings: data/processed/embeddings   # dossier : keys.json + vectors.npy + meta.json
  embed_metrics: metrics/embed.json
  new_data: data/new-data.json
  chunks: data/chunks_with_embeddings.json
  index: data/faiss_index.idx

ingest:
  # Jeu public « evenements-publics-openagenda » sur OpenDataSoft (sans clé d'API)
  base_url: https://public.opendatasoft.com/api/explore/v2.1/catalog/datasets/evenements-publics-openagenda
  region: Provence-Alpes-Côte d'Azur
  timeout_seconds: 120
  max_retries: 3
  retry_base_seconds: 5.0      # délai doublé à chaque nouvelle tentative
  # Liste blanche : seuls ces champs sont conservés. Les champs contributor_*
  # (nom, e-mail, téléphone des contributeurs) sont refusés par la validation.
  fields:
    - uid
    - title_fr
    - description_fr
    - longdescription_fr
    - conditions_fr
    - keywords_fr
    - daterange_fr
    - timings
    - firstdate_begin
    - firstdate_end
    - lastdate_begin
    - lastdate_end
    - updatedat
    - canonicalurl
    - attendancemode
    - age_min
    - age_max
    - location_name
    - location_address
    - location_city
    - location_postalcode
    - location_department
    - location_region
    - location_phone
    - location_website

chunking:
  strip_html: true             # convertit le HTML des descriptions en texte (≈ -12 % de tokens)
  tokenizer: cl100k_base      # encodage tiktoken utilisé pour compter les tokens
  split_threshold: 512         # une description de plus de N tokens est découpée...
  chunk_size: 400              # ...en chunks d'au plus N tokens
  chunk_overlap: 50
  separators: ["\n\n", "\n", ". ", " ", ""]

# Modèles servis par Azure OpenAI (France Central) : chaque nom de modèle est
# aussi le nom de son déploiement Azure.
embedding:
  model: text-embedding-3-small  # 1 536 dimensions ; tokenizer cl100k_base
  max_tokens_per_batch: 20000  # quota du déploiement : 1M tokens/min
  pause_seconds: 0.5           # pause entre deux lots
  max_retries: 5               # sur 429, 5xx et erreurs réseau
  retry_base_seconds: 10.0     # délai doublé à chaque tentative : 10, 20, 40, 80, 160 s
  rate_limit_pause_seconds: 60.0  # utilisé par l'ancien load_new_data.py (supprimé à l'étape 3)

retrieval:
  k: 5                         # nombre d'événements distincts envoyés au LLM
  candidate_factor: 10         # chunks candidats = k × facteur, avant déduplication par événement

generation:
  model: gpt-4.1-mini          # remplace open-mistral-7b codé en dur dans Projet_7
  temperature: 0.3
  max_tokens: 1000

evaluation:
  judge_model: gpt-5-mini      # distinct du générateur : évite l'auto-évaluation, quota séparé
  judge_delay_seconds: 8.0     # délai minimal entre deux appels au juge
  judge_max_retries: 5
  delay_between_cases_seconds: 15.0
  thresholds:                  # condition de mise en production (à recalibrer avec gpt-5-mini)
    faithfulness: 0.8
    answer_relevancy: 0.75
    contextual_precision: 0.7
    contextual_recall: 0.7
