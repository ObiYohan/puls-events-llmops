# Hyperparamètres du RAG : seule source de vérité pour toutes les valeurs réglables.
# Suivi par DVC (section `params` des étapes) et loggé dans MLflow à chaque run.
# Les secrets n'ont rien à faire ici : ils passent par les variables d'environnement.

paths:                         # relatifs à la racine du projet
  raw_events: data/raw/events.json
  ingest_metrics: metrics/ingest.json
  chunks_dataset: data/processed/chunks.json
  chunk_metrics: metrics/chunk.json
  embeddings: data/processed/embeddings   # dossier : keys.json + vectors.npy + meta.json
  embed_metrics: metrics/embed.json
  index_dir: data/processed/index        # artefact servi par l'API : faiss.index + chunks.json + manifest.json
  index_metrics: metrics/build_index.json
  reference_set: tests/eval/reference_set.json  # jeu de référence versionné dans Git
  eval_metrics: metrics/evaluate.json
  eval_cases: data/eval/cases.json      # détail par question (réponse, contexte, scores, raisons)
  system_prompt: src/prompts/system_prompt.txt  # prompt de génération (hash loggé dans MLflow)
  promotion_report: metrics/promotion.json
  served_index_dir: data/served/index  # index champion téléchargé par l'API au démarrage

ingest:
  # Jeu public « evenements-publics-openagenda » sur OpenDataSoft (sans clé d'API)
  base_url: https://public.opendatasoft.com/api/explore/v2.1/catalog/datasets/evenements-publics-openagenda
  region: Provence-Alpes-Côte d'Azur
  timeout_seconds: 120
  max_retries: 3
  retry_base_seconds: 5.0      # délai doublé à chaque nouvelle tentative
  # Un événement commençant plus de N jours après la collecte est écarté : ce sont
  # des dates factices (66 hébergements saisis au 01/01/2032 le 27/11/2026).
  max_days_ahead: 730
  # Liste blanche : seuls ces champs sont conservés. Les champs contributor_*
  # (nom, e-mail, téléphone des contributeurs) sont refusés par la validation.
  fields:
    - uid
    - title_fr
    - description_fr
    - longdescription_fr
    - conditions_fr
    - keywords_fr
    - daterange_fr
    - timings
    - firstdate_begin
    - firstdate_end
    - lastdate_begin
    - lastdate_end
    - updatedat
    - canonicalurl
    - attendancemode
    - age_min
    - age_max
    - location_name
    - location_address
    - location_city
    - location_postalcode
    - location_department
    - location_region
    - location_phone
    - location_website

chunking:
  strip_html: true             # convertit le HTML des descriptions en texte (≈ -12 % de tokens)
  tokenizer: cl100k_base      # encodage tiktoken utilisé pour compter les tokens
  split_threshold: 512         # une description de plus de N tokens est découpée...
  chunk_size: 400              # ...en chunks d'au plus N tokens
  chunk_overlap: 50
  separators: ["\n\n", "\n", ". ", " ", ""]

# Modèles servis par Azure OpenAI (France Central) : chaque nom de modèle est
# aussi le nom de son déploiement Azure.
embedding:
  model: text-embedding-3-small  # 1 536 dimensions ; tokenizer cl100k_base
  max_tokens_per_batch: 20000  # quota du déploiement : 1M tokens/min
  pause_seconds: 0.5           # pause entre deux lots
  max_retries: 5               # sur 429, 5xx et erreurs réseau
  retry_base_seconds: 10.0     # délai doublé à chaque tentative : 10, 20, 40, 80, 160 s

retrieval:
  k: 5                         # nombre d'événements distincts envoyés au LLM
  candidate_factor: 10         # chunks candidats = k × facteur, avant déduplication par événement

generation:
  model: gpt-4.1-mini          # remplace open-mistral-7b codé en dur dans Projet_7
  temperature: 0.3
  max_tokens: 1000

evaluation:
  judge_model: gpt-5-mini      # distinct du générateur : évite l'auto-évaluation, quota séparé
  judge_reasoning_effort: low  # minimal | low | medium | high : qualité contre coût et latence du juge
  max_workers: 4               # cas évalués en parallèle (quotas : juge 200k, génération 100k tokens/min)
  max_retries: 5               # sur 429, 5xx et erreurs réseau
  retry_base_seconds: 10.0     # délai doublé à chaque tentative
  max_error_rate: 0.0          # part de métriques en erreur tolérée ; au-delà, l'évaluation est invalide
  # Seuils plancher de mise en production, calibrés le 27/11/2026 avec le juge
  # gpt-5-mini sur 3 évaluations complètes (24 questions). Moyennes observées :
  # faithfulness 0,977–0,982 ; answer_relevancy 0,976–0,992 ;
  # contextual_precision 0,912–0,953 ; contextual_recall 0,917–1,000.
  # Écart entre deux exécutions identiques (bruit du juge) : jusqu'à 0,08.
  # Seuil ≈ minimum observé − 0,1. À recalibrer si le juge ou le jeu de référence change.
  thresholds:
    faithfulness: 0.88
    answer_relevancy: 0.88
    contextual_precision: 0.80
    contextual_recall: 0.82

promotion:
  # La version candidate devient « champion » si l'évaluation est valide, si
  # tous les seuils sont atteints et si aucune métrique ne recule de plus de
  # `tolerance` par rapport au champion (bruit du juge observé : jusqu'à 0,08).
  # La comparaison au champion n'a de sens qu'avec le même juge et le même jeu
  # de référence ; sinon seuls les seuils s'appliquent.
  tolerance: 0.05

mlflow:                        # serveur MLflow : variables MLFLOW_TRACKING_* (.env / secrets CI)
  experiment: puls-events-rag
  registered_model: puls-events-rag
  champion_alias: champion

pricing:                       # $ par million de tokens (Azure, Global Standard), pour le coût des runs
  # Vérifiés le 27/11/2026 (Azure Retail Prices) sauf gpt-5-mini : tarif public
  # OpenAI, à confirmer sur la facture Azure.
  text-embedding-3-small: {input: 0.02, output: 0.0}
  gpt-4.1-mini: {input: 0.40, output: 1.60}
  gpt-5-mini: {input: 0.25, output: 2.00}
