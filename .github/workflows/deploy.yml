name: Déploiement API

# Construit l'image de l'API (sans données), la publie sur ghcr.io puis met à
# jour la Container App Azure. L'étape Azure est sautée tant que la variable
# AZURE_CONTAINERAPP_NAME n'est pas définie (premier déploiement : voir
# docs/deploiement_azure.md).
on:
  push:
    branches: [master]
    paths:
      - "api/**"
      - "src/**"
      - "params.yaml"
      - "Dockerfile"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write     # publication de l'image sur ghcr.io
  id-token: write     # connexion à Azure par OIDC (sans secret de mot de passe)

concurrency:
  group: deploy-api
  cancel-in-progress: false

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - run: uv python install 3.13
      - run: uv sync --locked
      - run: uv run pytest tests/ -q

  deploy:
    name: Image et Container App
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Nom de l'image (ghcr.io exige des minuscules)
        env:
          OWNER: ${{ github.repository_owner }}
        run: echo "IMAGE=ghcr.io/${OWNER,,}/puls-events-api" >> "$GITHUB_ENV"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construire et publier l'image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest

      - name: Connexion à Azure (OIDC)
        if: vars.AZURE_CONTAINERAPP_NAME != ''
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Mettre à jour la Container App
        if: vars.AZURE_CONTAINERAPP_NAME != ''
        env:
          APP: ${{ vars.AZURE_CONTAINERAPP_NAME }}
          RG: ${{ vars.AZURE_RESOURCE_GROUP }}
          SHA: ${{ github.sha }}
        run: |
          az extension add --name containerapp --upgrade --only-show-errors
          az containerapp update -n "$APP" -g "$RG" --image "$IMAGE:$SHA" --only-show-errors \
            --query "properties.latestRevisionName" -o tsv
          fqdn=$(az containerapp show -n "$APP" -g "$RG" --query properties.configuration.ingress.fqdn -o tsv)
          echo "API déployée : https://$fqdn (image $SHA)" >> "$GITHUB_STEP_SUMMARY"
