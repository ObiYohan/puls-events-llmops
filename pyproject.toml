[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "puls-events-llmops"
version = "0.1.0"
description = "Industrialisation LLMOps du chatbot RAG Puls-Events (événements culturels PACA)"
requires-python = ">=3.13"
dependencies = [
    "python-dotenv>=1.0.0",
    "faiss-cpu>=1.13.2",
    "fastapi>=0.136.1",
    "langchain-text-splitters>=1.1.2",
    "pandas>=3.0.2",
    "tiktoken>=0.12.0",
    "mistralai==1.12.4",
    "uvicorn>=0.30.0",
    "dvc>=3.67.1",
    "pyyaml>=6.0.3",
    "pydantic>=2.13.3",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/pyproject.toml",
    "/README.md",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
]
eval = [
    "deepeval>=4.3.5",
    "tabulate>=0.9.0",
]

[tool.uv]
# `uv sync` installe aussi les outils de test et d'évaluation en local ;
# l'image Docker n'installe que les dépendances du projet.
default-groups = ["dev", "eval"]
