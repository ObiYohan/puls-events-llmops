# Pipeline RAG : ingest → chunk → embed → build_index → evaluate
# Les ${...} sont lus dans params.yaml : les chemins ne sont définis qu'une fois.
stages:
  ingest:
    cmd: python -m src.pipeline.ingest
    deps:
      - src/pipeline/ingest.py
      - src/pipeline/utils.py
    params:
      - ingest
    outs:
      - ${paths.raw_events}
    metrics:
      - ${paths.ingest_metrics}:
          cache: false
    # La source est externe : on interroge l'API à chaque exécution. Si le
    # contenu n'a pas changé, le hash est identique et la suite n'est pas relancée.
    always_changed: true

  chunk:
    cmd: python -m src.pipeline.chunk
    deps:
      - src/pipeline/chunk.py
      - src/pipeline/utils.py
      - ${paths.raw_events}
    params:
      - chunking
    outs:
      - ${paths.chunks_dataset}
    metrics:
      - ${paths.chunk_metrics}:
          cache: false

  embed:
    cmd: python -m src.pipeline.embed
    deps:
      - src/pipeline/embed.py
      - src/pipeline/utils.py
      - src/llm.py
      - ${paths.chunks_dataset}
    params:
      - embedding
      - chunking.tokenizer
    outs:
      # Le dossier sert aussi de cache : DVC ne le vide pas avant l'exécution,
      # seuls les chunks nouveaux ou modifiés sont envoyés à l'API Azure OpenAI.
      - ${paths.embeddings}:
          persist: true
    metrics:
      - ${paths.embed_metrics}:
          cache: false

  build_index:
    cmd: python -m src.pipeline.build_index
    deps:
      - src/pipeline/build_index.py
      - src/pipeline/embed.py
      - src/pipeline/utils.py
      - ${paths.chunks_dataset}
      - ${paths.embeddings}
    params:
      - embedding.model
    outs:
      # Artefact unique servi par l'API (index FAISS + chunks + manifeste).
      - ${paths.index_dir}
    metrics:
      - ${paths.index_metrics}:
          cache: false
